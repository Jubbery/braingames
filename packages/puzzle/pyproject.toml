[project]
name = "braingames-puzzle"
version = "0.1.0"
description = "Crossword construction: lexicon, grid templates, fill solver, mechanical QA"
requires-python = ">=3.11"
dependencies = [
    "braingames-core",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braingames_puzzle"]

[tool.uv.sources]
braingames-core = { workspace = true }
