[project]
name = "braingames-core"
version = "0.1.0"
description = "Shared config, metered Anthropic client, and cost accounting"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braingames_core"]
